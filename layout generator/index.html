<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML LayoutLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white antialiased">

    <div class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-gray-800/80 backdrop-blur-sm border-b border-gray-700 sticky top-0 z-50">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                    <h1 class="text-xl font-bold tracking-wider">LayoutLab Pro</h1>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto px-6 py-8 md:py-12">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

                <!-- Controls Sidebar -->
                <aside class="lg:col-span-3">
                    <div class="bg-gray-800 p-6 rounded-2xl shadow-lg sticky top-24">
                        <h2 class="text-lg font-semibold mb-4 text-indigo-300">Generator Controls</h2>
                        <div class="space-y-6">
                            <div>
                                <label for="layout-select" class="block text-sm font-medium text-gray-400 mb-2">Select a Component</label>
                                <select id="layout-select" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                                    <option value="hero">Hero Section</option>
                                    <option value="pricing">Pricing Table</option>
                                    <option value="contact">Contact Form</option>
                                    <option value="features">Features Section</option>
                                    <option value="testimonial">Testimonial</option>
                                    <option value="footer">Footer</option>
                                </select>
                            </div>
                            <button id="generate-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105 shadow-lg">
                                Generate Layout
                            </button>
                        </div>
                    </div>
                </aside>

                <!-- Preview Area -->
                <div class="lg:col-span-9">
                    <div class="bg-gray-800 rounded-2xl shadow-lg">
                        <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                            <h3 class="text-lg font-semibold text-gray-300">Live Preview</h3>
                            <button id="show-code-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg text-sm transition">
                                View Code
                            </button>
                        </div>
                        <div id="preview-area" class="p-4 md:p-8 min-h-[500px] bg-gray-900 rounded-b-2xl">
                            <!-- Generated layout will be injected here -->
                            <div class="flex items-center justify-center h-full text-gray-500">
                                <p>Select a component and click "Generate Layout" to see a preview.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-800/50 mt-12 border-t border-gray-700">
            <div class="container mx-auto px-6 py-4 text-center text-gray-500">
                <p>© 2026 LayoutLab Pro. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Code Modal -->
    <div id="code-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-gray-800 rounded-2xl shadow-2xl w-11/12 max-w-4xl max-h-[80vh] flex flex-col">
            <div class="p-4 flex justify-between items-center border-b border-gray-700">
                <h4 class="text-lg font-semibold">Generated HTML Code</h4>
                <button id="close-modal-btn" class="text-gray-400 hover:text-white">×</button>
            </div>
            <div class="p-4 flex-grow overflow-y-auto">
                <pre><code id="code-output" class="language-html text-sm"></code></pre>
            </div>
            <div class="p-4 border-t border-gray-700">
                <button id="copy-code-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition">
                    Copy to Clipboard
                </button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
